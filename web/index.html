<!doctype html>
<!-- The web version's page (see docs/platform.md, Web): Qt's loader starts
     Koil's wasm in #screen, which fills the window. Until then, and if it
     stops, #status says so. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- One CSS pixel a Qt pixel, as Qt's own page has it. -->
  <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
  <title>Koil</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    /* Koil's colors in its light and dark themes (Fusion's), so the page
       doesn't flash another color before Koil draws: the editor's, and the
       windows' (with their frames, see frames below). The browser's mode
       until Koil gives its own (these variables, inline on the root, and
       data-theme, see cpp/web.h). */
    :root {
      color-scheme: light dark;
      --base: #ffffff; --text: #6b6b6b; --window: #efefef; --window-text: #303030;
      --button: none; --button-hover: invert(0.45);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --base: #242424; --text: #a8a8a8; --window: #323232; --window-text: #e0e0e0;
        --button: invert(0.85); --button-hover: invert(0.6);
      }
    }
    :root[data-theme="dark"] {
      --base: #242424; --text: #a8a8a8; --window: #323232; --window-text: #e0e0e0;
      --button: invert(0.85); --button-hover: invert(0.6);
    }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--base); color: var(--text);
      font: 15px/1.5 system-ui, sans-serif;
    }
    #screen { position: fixed; inset: 0; }
    #status {
      position: fixed; inset: 0; padding: 16px;
      display: flex; flex-direction: column; gap: 16px;
      align-items: center; justify-content: center; text-align: center;
    }
    #status[hidden] { display: none; }
    #status img { width: 64px; height: 64px; }
  </style>
</head>
<body>
  <div id="screen"></div>
  <div id="status">
    <img src="icon.png" alt="">
    <div id="message">Loading Koil…</div>
    <noscript>Koil needs JavaScript.</noscript>
  </div>
  <script src="qtloader.js"></script>
  <script src="koil.js"></script>
  <script>
    const screen = document.getElementById("screen");
    const status = document.getElementById("status");
    const message = document.getElementById("message");

    function stopped(why) {
      message.textContent = "Koil stopped. Reload the page to start again."
        + (why ? "\n(" + why + ")" : "");
      message.style.whiteSpace = "pre-line";
      screen.hidden = true;
      status.hidden = false;
    }

    // Qt draws the frames of Koil's other windows (Settings, Shortcuts,
    // the help's) in the page, in its shadow DOM, light gray in either
    // theme: these draw them in Koil's window color.
    const frames = `
      .qt-decorated-window { background-color: var(--window); }
      .qt-decorated-window.has-border { border-color: var(--window); }
      .title-bar .window-name { font: 12px system-ui, sans-serif; color: var(--window-text); }
      .title-bar .action-button img { filter: var(--button); }
      .title-bar .action-button:hover img { filter: var(--button-hover); }`;

    // Once Koil runs: Qt makes its shadow DOM as it starts.
    function started(instance) {
      const shadow = screen.querySelector("div")?.shadowRoot;
      if (shadow) {
        const style = document.createElement("style");
        style.textContent = frames;
        shadow.append(style);
      }
      // As `koil`, for the console and scripts/web-smoke.mjs (`koil.FS`
      // is its disk).
      window.koil = instance;
    }

    const loading = qtLoad({
      qt: {
        entryFunction: window.koil_entry,
        containerElements: [screen],
        onLoaded: () => { status.hidden = true; },
        // A crash, or a panic, which aborts (see docs/platform.md, Web).
        onExit: exit => stopped(exit.text),
      },
    });
    loading.then(started, error => {
      console.error(error);
      stopped(String(error));
    });
  </script>
</body>
</html>
