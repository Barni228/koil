name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Qt 6.11+ for Windows uses a repository layout that aqtinstall 3.3
      # can't read yet, so stay on 6.10 here until it does.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          arch: win64_msvc2022_64
          cache: true
          # Older aqtinstall releases can't download recent Qt versions.
          aqtversion: ">=3.1"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          cache: true
          # Older aqtinstall releases can't download recent Qt versions.
          aqtversion: ">=3.1"

      - name: Build disk image
        run: ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # The Rust tests and the QML tests, with the same Qt as the installers.
  # The QML tests open windows, as the app does, with the system's fonts;
  # some fail now and then for timing alone, so qml-tests.sh runs a test
  # that failed again, and fails only if it fails every time.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt: "6.11.*"
            arch: clang_64
          - os: windows-latest
            qt: "6.10.*"
            arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          cache: true
          aqtversion: ">=3.1"

      - name: Rust tests
        run: cargo test --locked

      - name: QML tests
        shell: bash
        run: scripts/qml-tests.sh

  # Pushing a tag like v0.1.0 publishes both installers as a GitHub release,
  # if the tests pass.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
