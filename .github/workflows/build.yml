name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Qt 6.11+ for Windows uses a repository layout that aqtinstall 3.3
      # can't read yet, so stay on 6.10 here until it does.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          arch: win64_msvc2022_64
          cache: true
          # Older aqtinstall releases can't download recent Qt versions.
          aqtversion: ">=3.1"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          cache: true
          # Older aqtinstall releases can't download recent Qt versions.
          aqtversion: ">=3.1"

      - name: Build disk image
        run: ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # The Rust tests and the QML tests, with the same Qt as the installers.
  # The QML tests open windows, as the app does, with the system's fonts;
  # some fail now and then for timing alone, so qml-tests.sh runs a test
  # that failed again, and fails only if it fails every time.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            qt: "6.11.*"
            arch: clang_64
          - os: windows-latest
            qt: "6.10.*"
            arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          cache: true
          aqtversion: ">=3.1"

      - name: Rust tests
        id: rust
        run: cargo test --locked

      # Also if the Rust tests failed, which they don't depend on.
      - name: QML tests
        if: success() || steps.rust.outcome == 'failure'
        shell: bash
        run: scripts/qml-tests.sh

  # The web version (docs/platform.md, Web), on every push, so a broken web
  # build shows early: built, checked in headless Chrome, and kept as the
  # Pages artifact, which the pages job publishes for a v* tag.
  web:
    runs-on: ubuntu-latest
    env:
      # Qt for WebAssembly, and the desktop Qt of the same version, whose
      # tools build for it.
      QT_VERSION: "6.11.2"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
      # Corrosion builds in CMake's dir.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web -> ../target/web-build/cargo

      - uses: actions/cache@v6
        id: tools
        with:
          path: ${{ runner.temp }}/tools
          key: web-tools-${{ env.QT_VERSION }}-v1

      # Emscripten at the version Qt names (QT_EMCC_RECOMMENDED_VERSION).
      - name: Install Qt and Emscripten
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          tools="$RUNNER_TEMP/tools"
          pipx run --spec "aqtinstall>=3.3" aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -O "$tools/qt"
          pipx run --spec "aqtinstall>=3.3" aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$tools/qt"
          emcc=$(sed -n 's/.*set(QT_EMCC_RECOMMENDED_VERSION "\(.*\)").*/\1/p' \
            "$tools/qt/$QT_VERSION/wasm_singlethread/lib/cmake/Qt6/QtPublicWasmToolchainHelpers.cmake")
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$tools/emsdk"
          "$tools/emsdk/emsdk" install "$emcc"
          "$tools/emsdk/emsdk" activate "$emcc"

      - name: Build
        run: |
          tools="$RUNNER_TEMP/tools"
          QT_WASM="$tools/qt/$QT_VERSION/wasm_singlethread" QT_HOST="$tools/qt/$QT_VERSION/gcc_64" \
            EMSDK="$tools/emsdk" scripts/build-web.sh

      # Its WebSocket and fetch, for the smoke test.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Smoke test
        run: node scripts/web-smoke.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/web

  # A v* tag publishes the web version to GitHub Pages, once the tests
  # pass. The repo's Settings > Pages > Source must be GitHub Actions, and
  # the github-pages environment must allow v* tags.
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Pushing a tag like v0.1.0 publishes both installers as a GitHub release,
  # if the tests pass.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the installers: the web job's github-pages artifact (a tar)
      # is for the pages job.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{windows-installer,macos-dmg}"
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
