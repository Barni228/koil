[package]
name = "koil"
version = "0.1.0"
edition = "2024"
description = "Koil's desktop app, built with Rust, Qt and QML"
repository = "https://github.com/Barni228/koil"
publish = false

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"

# `cargo release` tags a version only from main; CI builds the installers.
[package.metadata.release]
allow-branch = ["main"]
