[package]
name = "koil"
version = "0.1.0"
edition = "2024"
description = "File manager that works like a text editor, with vim"
repository = "https://github.com/Barni228/koil"
publish = false

[dependencies]
# First-party dependencies
koil-core = { git = "https://github.com/Barni228/koil-core" }

# Third-party dependencies
# the dates the listing shows when sorted by them, in the local time zone
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# the command line (`command!` takes the name and version from here)
clap = { version = "4.6", features = ["cargo"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
devicons = "0.6"
# watches the open dir, so the listing shows what changes on disk
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10"
# the exe's icon on Windows
embed-resource = "3"

# `cargo release` tags a version only from main; CI builds the installers.
[package.metadata.release]
allow-branch = ["main"]
