[package]
name = "koil"
version = "0.1.0"
edition = "2024"
description = "File manager that works like a text editor, with vim"
repository = "https://github.com/Barni228/koil"
license = "MIT"
publish = false
# cxx-qt-build hands the C++ it builds (and the QML module) on to a crate
# that depends on this one only by a links key: the web build's (`web/`).
links = "koil"

[dependencies]
# First-party dependencies
koil-core = { git = "https://github.com/Barni228/koil-core" }

# Third-party dependencies
# the dates the listing shows when sorted by them, in the local time zone
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# the command line (`command!` takes the name and version from here)
clap = { version = "4.6", features = ["cargo"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
devicons = "0.6"
# `canonicalize` without the `\\?\` Windows puts before every path, as koil-core's
dunce = "1.0"
# watches the open dir, so the listing shows what changes on disk
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the web version's export of a folder, as a .zip, deflated by flate2 with
# miniz_oxide, which is Rust alone, so it builds for the web
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
# signals to stop a shell command and what it started (its process group),
# and what's mounted where on macOS
libc = "0.2"

# the names of a file's owner and group, which `K` shows (not on the web,
# which has no users, and where uzers doesn't build)
[target.'cfg(all(unix, not(target_os = "emscripten")))'.dependencies]
uzers = { version = "0.12", default-features = false }

# a drive's capacity and free space, which `K` shows
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10"
# the exe's icon on Windows
embed-resource = "3"

# `cargo release` tags a version only from main; CI builds the installers.
[package.metadata.release]
allow-branch = ["main"]
